name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"   # 毎日、メンバー一覧を更新する
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: メンバー一覧を取得する
        env:
          GH_TOKEN: ${{ github.token }}
          ORG: 0xFF-MinusOne
        run: sh scripts/members.sh > members.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
